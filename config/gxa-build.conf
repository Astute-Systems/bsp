BOARD='gxa-1'
VENDOR='astute-systems'


BOARD='gxa-1'  # The board identifier
VENDOR='astute-systems'  # Vendor name

# Define the project root directory
PROJECT_ROOT=$(pwd)

# Configuration directory and XML file for L4T sources
CONFIG=$PROJECT_ROOT/config
XML_FILE=$CONFIG/l4t-sources.xml

# Build directory and cache location
BUILD=$PROJECT_ROOT/build
CACHE_DIR=$BUILD/cache

# Source directories for L4T and related components
SOURCES=$BUILD/l4t
FLAGS=$SOURCES/flags
L4T=$SOURCES/Linux_for_Tegra
L4T_ROOTFS=$L4T/rootfs  # Root filesystem for L4T
KERNEL_SOURCES=$L4T/source  # Kernel source directory

# Device Tree Blob (DTB) file for the board
# This must match the board definition file in ./config/l4t-overlay/jetson-agx-orin-gxa-1.conf
DTB_FILE="tegra234-p3737-0000+p3701-0008-nv.dtb"

# Compiler used during the build process
# COMPILER_ROOT: sub-path under $KERNEL_SOURCES to the toolchain directory (containing bin/)
# COMPILER_PREFIX: aarch64 toolchain triplet prefix (e.g. aarch64-buildroot-linux-gnu- or aarch64-none-linux-gnu-)
# Both are set dynamically by gxa-init-build-machine.sh
COMPILER=x-tools
COMPILER_ROOT=x-tools/aarch64-none-linux-gnu
COMPILER_PREFIX=aarch64-none-linux-gnu-

# Offline board spec for the GXA-1 (P3701-0008 industrial module on the GXA-1
# carrier). These are exported into the environment when flash.sh is invoked
# with --no-flash and no target board is connected in recovery mode. When a
# target IS connected, flash.sh reads the same values from the module EEPROM
# and these are effectively ignored.
#
# Values match the "jetson-agx-orin-devkit-industrial" entry in the L4T r39.2
# nvautoflash matrix (BOARDID=3701, BOARDSKU=0008) and the defaults for the
# P3701-0008 SKU (FAB=TS4, BOARDREV=A.0, CHIP_SKU=00:00:00:D0, RAMCODE=4).
GXA_BOARDID="3701"
GXA_FAB="TS4"
GXA_BOARDSKU="0008"
GXA_BOARDREV="A.0"
GXA_CHIP_SKU="00:00:00:D0"
GXA_CHIP_MINOR="1"
GXA_BOOTROM_ID="1"
GXA_RAMCODE_ID="4"

