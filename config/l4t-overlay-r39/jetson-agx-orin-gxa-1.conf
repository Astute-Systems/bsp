#
# jetson-agx-orin-gxa-1.conf: configuration for Astute Systems GXA-1
# (P3701-0008 industrial module on GXA-1 carrier board).
# Based on r39 jetson-agx-orin-devkit-industrial.conf with GXA-1 tweaks:
#   - GXA-1 carrier pinmux / padvoltage / gpio
#   - HDMI dtbo added to the kernel-dtb overlay chain
#   - ODMDATA switched for gbe0-enable-10g / RGMII gbe0
#
# Sourced by bash script.
# shellcheck shell=bash
# shellcheck disable=SC2034,SC2154

source "${LDK_DIR}/p3701.conf.common";

# update_flash_args_common:
update_flash_args_common()
{
	# Special handling of INT-fused "p3701-0008"
	if [ "${chip_SKU}" = "00" ]; then
		BPFFILE=$(echo "${BPFFILE}" | sed "s|T.*-A1|TE992M-A1|");
	fi;
}

# update_flash_args:
update_flash_args()
{
	update_flash_args_common
}

# GXA-1 carrier board pinmux / padvoltage / gpio (shipped in overlay)
PINMUX_CONFIG="Orin-gxa-1-pinmux.dtsi";
PMC_CONFIG="Orin-gxa-1-padvoltage-default.dtsi";
PINMUX_GPIO_CONFIG="Orin-gxa-1-gpio-default.dtsi";

BPFDTB_FILE="tegra234-bpmp-3701-0008-3737-0000.dtb";
DTB_FILE="tegra234-p3737-0000+p3701-0008-nv.dtb";
TBCDTB_FILE="${DTB_FILE}";
BADPAGEFILE="bootloader/badpage.bin";
EMMC_CFG="flash_t234_qspi_sdmmc_industrial.xml";
FSIFWFILE="bootloader/fsi-lk.bin";
PMIC_CONFIG="tegra234-mb1-bct-pmic-p3701-0008.dts";
MISC_CONFIG="tegra234-mb1-bct-misc-p3701-0008-flash.dts";
MISC_COLD_BOOT_CONFIG="tegra234-mb1-bct-misc-p3701-0008.dts";
MB2_BCT="tegra234-mb2-bct-misc-p3701-0008.dts";

# Kernel-DTB overlay chain: drop camera overlays (GXA-1 has no NVIDIA cameras
# on the reference carrier); keep L4TConfiguration + carveouts + optee, and
# add the HDMI display config overlay.
OVERLAY_DTB_FILE="L4TConfiguration.dtbo,tegra234-carveouts.dtbo,tegra-optee.dtbo,tegra234-dcb-p3767-0000-hdmi.dtbo";
DCE_OVERLAY_DTB_FILE="tegra234-dcb-p3767-0000-hdmi.dtbo";

# GXA-1 uses gbe0 (EQoS RGMII) as a 1G PHY. Enable it via odmdata.
ODMDATA="gbe-uphy-config-22,nvhs-uphy-config-0,hsio-uphy-config-16,gbe0-enable-10g";

CMDLINE_ADD+=" pci=pcie_bus_perf";

# Rootfs A/B / disk encryption plumbing (mirrors the industrial devkit conf):
if [[ "${ROOTFS_AB}" == 1 && "${ROOTFS_ENC}" == "" ]]; then
	EMMC_CFG=flash_t234_qspi_sdmmc_industrial_rootfs_ab.xml;
elif [[ "${ROOTFS_AB}" == "" && "${ROOTFS_ENC}" == 1 ]]; then
	disk_enc_enable=1;
	EMMC_CFG=flash_t234_qspi_sdmmc_industrial_enc_rfs.xml;
elif [[ "${ROOTFS_AB}" == 1 && "${ROOTFS_ENC}" == 1 ]]; then
	disk_enc_enable=1;
	EMMC_CFG=flash_t234_qspi_sdmmc_industrial_enc_rootfs_ab.xml;
fi;
